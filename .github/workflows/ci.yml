name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Run real-data batch Stage A-B analysis
        run: >-
          python scripts/analyze_batch_kinetic_fingerprints.py
          --output results/batch-stage-ab-ci
      - name: Run Stage C material-aware evidence gate
        run: >-
          python scripts/run_stage_c_material_fingerprint.py
          --input results/batch-stage-ab-ci/kinetic_fingerprints.csv
          --output results/stage-c-material-aware-ci
      - name: Run Stage C feature ablation
        run: >-
          python scripts/run_stage_c_feature_ablation.py
          --input results/batch-stage-ab-ci/kinetic_fingerprints.csv
          --output results/stage-c-feature-ablation-ci
      - name: Upload batch modelling artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: batch-stage-abc
          path: |
            results/batch-stage-ab-ci
            results/stage-c-material-aware-ci
            results/stage-c-feature-ablation-ci
