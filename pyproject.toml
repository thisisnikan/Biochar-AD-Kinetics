[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biochar-ad-kinetics"
version = "0.1.0"
description = "Reproducible kinetic modelling of biochar-amended anaerobic digestion batch tests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nikan Haghighatjue"}]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
service = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
biochar-ad = "biochar_ad_kinetics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
